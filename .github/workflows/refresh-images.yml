name: Refresh Amazon product images
on:
  schedule:
    - cron: "17 10 * * *"   # daily, about 4:17 AM Central
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch images from Creators API
        env:
          AMZ_CLIENT_ID: ${{ secrets.AMZ_CLIENT_ID }}
          AMZ_CLIENT_SECRET: ${{ secrets.AMZ_CLIENT_SECRET }}
        run: python3 _build/fetch_images.py
      - name: Rebuild site
        run: cd _build && python3 gen.py ..
      - name: Commit
        run: |
          git config user.name "The Elevated Cart"
          git config user.email "clareyoung927@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Daily product image refresh" && git push
